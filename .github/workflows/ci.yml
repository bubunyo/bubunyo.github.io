name: CI

on:
  push:
    branches: [master, gh-pages]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build and validate
        run: |
          chmod +x ./script/cibuild.sh
          ./script/cibuild.sh
